<!doctype html>
<html lang="sl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NPC Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #121417;
            --panel: #1b2026;
            --panel-2: #222932;
            --line: #323b46;
            --muted: #9aa6b2;
            --text: #eef3f7;
            --green: #44c27a;
            --blue: #5aa9ff;
            --amber: #e6b450;
            --red: #ef6b68;
            --violet: #a98df2;
            --input: #101317;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            min-height: 34px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 6px;
            padding: 7px 10px;
            cursor: pointer;
        }

        button:hover { border-color: #4c5967; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        .primary { border-color: rgba(68, 194, 122, 0.55); background: rgba(68, 194, 122, 0.16); color: #dff8e9; }
        .danger { border-color: rgba(239, 107, 104, 0.55); background: rgba(239, 107, 104, 0.14); color: #ffd9d8; }
        .blue { border-color: rgba(90, 169, 255, 0.55); background: rgba(90, 169, 255, 0.15); color: #d9ecff; }
        .amber { border-color: rgba(230, 180, 80, 0.55); background: rgba(230, 180, 80, 0.14); color: #ffedbf; }

        input, textarea, select {
            width: 100%;
            min-height: 34px;
            border: 1px solid var(--line);
            background: var(--input);
            color: var(--text);
            border-radius: 6px;
            padding: 7px 9px;
            outline: none;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
            font-family: "Cascadia Mono", Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
        }

        input[type="range"] { padding: 0; accent-color: var(--blue); }
        input[type="checkbox"] { width: auto; min-height: 0; }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            background: #15191e;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        h1, h2, h3 {
            margin: 0;
            letter-spacing: 0;
        }

        h1 { font-size: 22px; font-weight: 760; }
        h2 { font-size: 17px; font-weight: 720; }
        h3 { font-size: 14px; font-weight: 680; color: #dce5ec; }

        .subtle { color: var(--muted); }
        .small { font-size: 12px; }

        .topline {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
            padding: 3px 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            background: #171b20;
            white-space: nowrap;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .dot.on { background: var(--green); }
        .dot.off { background: var(--red); }
        .dot.wait { background: var(--amber); }

        nav {
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            background: #14181d;
        }

        .tab {
            white-space: nowrap;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
        }

        .tab.active {
            background: var(--panel-2);
            color: var(--text);
            border-color: #506070;
        }

        main {
            padding: 18px 20px 28px;
            min-width: 0;
        }

        .grid {
            display: grid;
            gap: 14px;
        }

        .overview-grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .two-col {
            grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
            align-items: start;
        }

        .three-col {
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 24px var(--shadow);
            min-width: 0;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        .panel-body {
            padding: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .metric {
            display: grid;
            gap: 6px;
            padding: 14px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 780;
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #171c22;
            min-width: 0;
        }

        .row.active {
            border-color: rgba(90, 169, 255, 0.75);
            background: rgba(90, 169, 255, 0.10);
        }

        .row-main {
            min-width: 0;
            display: grid;
            gap: 3px;
        }

        .row-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-weight: 680;
        }

        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 2px 7px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
            background: #151a20;
            font-size: 12px;
            white-space: nowrap;
        }

        .pill.green { color: #d9f8e5; border-color: rgba(68, 194, 122, 0.5); }
        .pill.blue { color: #d9ecff; border-color: rgba(90, 169, 255, 0.5); }
        .pill.amber { color: #ffedbf; border-color: rgba(230, 180, 80, 0.5); }
        .pill.red { color: #ffd9d8; border-color: rgba(239, 107, 104, 0.5); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 5px;
            color: var(--muted);
            min-width: 0;
        }

        label span {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #c9d3dc;
            font-size: 12px;
        }

        .split {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        .table th {
            color: var(--muted);
            font-weight: 620;
            font-size: 12px;
        }

        .log {
            display: grid;
            gap: 8px;
            max-height: 460px;
            overflow: auto;
            padding-right: 4px;
        }

        .log-line {
            border-left: 3px solid var(--line);
            padding: 7px 9px;
            background: #171c22;
            border-radius: 0 6px 6px 0;
        }

        .prompt-box {
            display: grid;
            gap: 10px;
        }

        .empty {
            color: var(--muted);
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            text-align: center;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            max-width: min(420px, calc(100vw - 36px));
            border: 1px solid var(--line);
            background: #182028;
            border-radius: 8px;
            padding: 11px 13px;
            color: var(--text);
            box-shadow: 0 16px 36px var(--shadow);
            display: none;
            z-index: 20;
        }

        .toast.show { display: block; }

        @media (max-width: 900px) {
            header { grid-template-columns: 1fr; }
            .topline { justify-content: flex-start; }
            .two-col { grid-template-columns: 1fr; }
            main { padding: 14px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div>
            <h1>NPC Control</h1>
            <div class="subtle small" id="subtitle">Nalagam stanje...</div>
        </div>
        <div class="topline">
            <span class="badge"><span id="socketDot" class="dot off"></span><span id="socketText">MindServer offline</span></span>
            <span class="badge"><span id="rpDot" class="dot off"></span><span id="rpText">RP ustavljen</span></span>
            <button class="blue" data-action="refresh">Refresh</button>
            <button class="primary" data-action="rp-runtime" data-runtime-action="start">Start RP</button>
            <button class="danger" data-action="rp-runtime" data-runtime-action="stop">Stop RP</button>
            <button class="danger" data-action="stop-all">Stop Kingdom</button>
        </div>
    </header>

    <nav id="tabs"></nav>
    <main id="content"></main>
</div>
<div id="toast" class="toast"></div>

<script>
const socket = io();
const tabs = [
    ['overview', 'Overview'],
    ['npcs', 'NPCs'],
    ['social', 'Social Structure'],
    ['storage', 'Storage'],
    ['access', 'Access'],
    ['logs', 'Logs'],
];

let activeTab = 'overview';
let dashboard = null;
let agents = [];
let agentStates = {};
let botOutputs = [];
let selectedKey = null;
let refreshTimer = null;

const content = document.getElementById('content');
const toast = document.getElementById('toast');

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
}

function pretty(value) {
    if (value === null || value === undefined || value === '') return '-';
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
}

function showToast(message, isError = false) {
    toast.textContent = message;
    toast.style.borderColor = isError ? 'rgba(239, 107, 104, 0.75)' : 'rgba(68, 194, 122, 0.65)';
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 3200);
}

async function api(path, options = {}) {
    const response = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.ok === false) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
}

function setSocketStatus(connected) {
    document.getElementById('socketDot').className = `dot ${connected ? 'on' : 'off'}`;
    document.getElementById('socketText').textContent = connected ? 'MindServer online' : 'MindServer offline';
}

function updateHeader() {
    const rp = dashboard?.rp?.runtime;
    const running = Boolean(rp?.running);
    const controllable = Boolean(rp?.controllable);
    document.getElementById('rpDot').className = `dot ${running ? (controllable ? 'on' : 'wait') : 'off'}`;
    document.getElementById('rpText').textContent = running
        ? (controllable ? `RP online PID ${rp.pid}` : `RP online PID ${rp.pid}, brez IPC`)
        : 'RP ustavljen';
    const rpCount = dashboard?.rp?.npcs?.length ?? 0;
    const onlineAgents = agents.filter(a => a.in_game).length;
    document.getElementById('subtitle').textContent =
        `${rpCount} RP NPC-jev, ${onlineAgents}/${agents.length} Mindcraft agentov online`;
}

async function refreshDashboard(silent = false) {
    try {
        const data = await api('/api/dashboard');
        dashboard = data;
        if (!selectedKey) {
            const firstRp = dashboard.rp?.npcs?.[0]?.id;
            const firstAgent = agents[0]?.name;
            selectedKey = firstRp ? `rp:${firstRp}` : (firstAgent ? `agent:${firstAgent}` : null);
        }
        updateHeader();
        render();
        if (!silent) showToast('Stanje osvezeno.');
    } catch (error) {
        showToast(error.message, true);
    }
}

function renderTabs() {
    document.getElementById('tabs').innerHTML = tabs.map(([key, label]) => `
        <button class="tab ${activeTab === key ? 'active' : ''}" data-action="tab" data-tab="${key}">${esc(label)}</button>
    `).join('');
}

function render() {
    renderTabs();
    updateHeader();
    if (activeTab === 'overview') renderOverview();
    else if (activeTab === 'npcs') renderNpcs();
    else if (activeTab === 'social') renderSocial();
    else if (activeTab === 'storage') renderStorage();
    else if (activeTab === 'access') renderAccess();
    else renderLogs();
}

function rpNpcs() {
    return dashboard?.rp?.npcs ?? [];
}

function kingdomMembers() {
    return Object.entries(dashboard?.kingdom?.society?.members ?? {})
        .map(([name, member]) => ({ name, ...member }));
}

function renderOverview() {
    const rp = dashboard?.rp;
    const kingdom = dashboard?.kingdom?.society;
    const rpOnline = rp?.runtime?.running ? 'running' : 'stopped';
    const leaders = rp?.civic?.social_structure?.leaders ?? [];
    const members = kingdomMembers();
    const onlineMembers = members.filter(m => m.online);
    content.innerHTML = `
        <div class="grid overview-grid">
            ${metric('RP runtime', rpOnline, rp?.runtime?.controllable ? 'Dashboard control active' : 'File view / external process')}
            ${metric('RP NPCs', rpNpcs().length, rpNpcs().map(n => n.config?.osebnost?.ime ?? n.id).join(', ') || '-')}
            ${metric('Kingdom agents', `${onlineMembers.length}/${members.length}`, kingdom?.name ?? 'Kraljestvo')}
            ${metric('Town day', rp?.civic?.current_day ?? '-', `Leader: ${leaders[0]?.name ?? leaders[0]?.id ?? '-'}`)}
        </div>
        <div class="grid two-col" style="margin-top:14px;">
            <section class="panel">
                <div class="panel-head"><h2>RP Town</h2><div class="toolbar">${runtimeButtons()}</div></div>
                <div class="panel-body">
                    <div class="list">
                        ${rpNpcs().map(npc => npcRow(`rp:${npc.id}`, npc.config?.osebnost?.ime ?? npc.id, [
                            npc.config?.job,
                            npc.state?.mood_danes,
                            `sitost ${npc.state?.potrebe?.sitost ?? '-'}`
                        ], Boolean(rp?.runtime?.running))).join('') || empty('Ni RP NPC-jev.')}
                    </div>
                </div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>Kingdom</h2><div class="toolbar"><button class="danger" data-action="stop-all">Stop All</button></div></div>
                <div class="panel-body">
                    <div class="list">
                        ${members.map(member => npcRow(`agent:${member.name}`, member.name, [
                            member.role,
                            member.action,
                            `${member.health ?? '-'} hp`
                        ], member.online)).join('') || empty('Ni kingdom state-a.')}
                    </div>
                </div>
            </section>
        </div>
        <div class="grid three-col" style="margin-top:14px;">
            ${recentPanel('Public events', rp?.civic?.public_events ?? [], 'text', 'ts')}
            ${recentPanel('Kingdom events', kingdom?.events ?? [], 'text', 'at')}
            ${recentPanel('Bot output', botOutputs.slice(-12), 'message', 'at')}
        </div>
    `;
}

function metric(title, value, detail) {
    return `
        <section class="panel metric">
            <div class="subtle small">${esc(title)}</div>
            <div class="metric-value">${esc(value)}</div>
            <div class="subtle small truncate">${esc(detail)}</div>
        </section>
    `;
}

function runtimeButtons() {
    return `
        <button class="primary" data-action="rp-runtime" data-runtime-action="start">Start</button>
        <button class="amber" data-action="rp-runtime" data-runtime-action="restart">Restart</button>
        <button class="danger" data-action="rp-runtime" data-runtime-action="stop">Stop</button>
    `;
}

function npcRow(key, title, details, online) {
    const active = selectedKey === key ? 'active' : '';
    const dotClass = online ? 'on' : 'off';
    return `
        <button class="row ${active}" data-action="select-npc" data-key="${esc(key)}">
            <span class="row-main">
                <span class="row-title"><span class="dot ${dotClass}"></span><span class="truncate">${esc(title)}</span></span>
                <span class="subtle small truncate">${details.filter(Boolean).map(esc).join(' | ')}</span>
            </span>
            <span class="pill ${online ? 'green' : 'red'}">${online ? 'online' : 'offline'}</span>
        </button>
    `;
}

function recentPanel(title, rows, textKey, timeKey) {
    const body = rows.slice(-10).reverse().map(row => `
        <div class="log-line">
            <div>${esc(row[textKey] ?? row.povzetek ?? row.zapis ?? row.message ?? '-')}</div>
            <div class="subtle small">${esc(row.actor ?? row.agentName ?? '')} ${esc(row[timeKey] ?? '')}</div>
        </div>
    `).join('');
    return `
        <section class="panel">
            <div class="panel-head"><h2>${esc(title)}</h2></div>
            <div class="panel-body"><div class="log">${body || empty('Ni zapisov.')}</div></div>
        </section>
    `;
}

function renderNpcs() {
    const selected = getSelected();
    content.innerHTML = `
        <div class="grid two-col">
            <section class="panel">
                <div class="panel-head"><h2>NPCs</h2><button data-action="refresh">Refresh</button></div>
                <div class="panel-body">
                    <h3>RP Town</h3>
                    <div class="list" style="margin-top:8px;">
                        ${rpNpcs().map(npc => npcRow(`rp:${npc.id}`, npc.config?.osebnost?.ime ?? npc.id, [
                            npc.config?.osebnost?.vloga,
                            npc.config?.job,
                            npc.state?.mood_danes
                        ], Boolean(dashboard?.rp?.runtime?.running))).join('') || empty('Ni RP NPC-jev.')}
                    </div>
                    <h3 style="margin-top:16px;">Kingdom</h3>
                    <div class="list" style="margin-top:8px;">
                        ${agents.map(agent => {
                            const live = agentStates[agent.name];
                            return npcRow(`agent:${agent.name}`, agent.name, [
                                live?.action?.current,
                                live?.gameplay ? `${live.gameplay.health} hp` : '',
                                agent.socket_connected && !agent.in_game ? 'joining' : ''
                            ], agent.in_game);
                        }).join('') || empty('Ni agentov.')}
                    </div>
                </div>
            </section>
            <section class="panel">
                ${selected ? renderSelectedNpc(selected) : `<div class="panel-body">${empty('Izberi NPC-ja.')}</div>`}
            </section>
        </div>
    `;
}

function getSelected() {
    if (!selectedKey) return null;
    const [kind, id] = selectedKey.split(':');
    if (kind === 'rp') return { kind, id, npc: rpNpcs().find(n => n.id === id) };
    return { kind, id, agent: agents.find(a => a.name === id), state: agentStates[id] };
}

function renderSelectedNpc(selected) {
    if (selected.kind === 'agent') return renderAgentDetails(selected.id, selected.agent, selected.state);
    if (!selected.npc) return `<div class="panel-body">${empty('NPC ni najden.')}</div>`;
    return renderRpNpcDetails(selected.npc);
}

function renderAgentDetails(name, agent, state) {
    const online = Boolean(agent?.in_game);
    const inv = state?.inventory?.counts ?? {};
    return `
        <div class="panel-head">
            <div>
                <h2>${esc(name)}</h2>
                <div class="subtle small">${esc(state?.action?.current ?? (online ? 'online' : 'offline'))}</div>
            </div>
            <div class="toolbar">
                <button class="primary" data-action="agent-start" data-name="${esc(name)}">Start</button>
                <button class="amber" data-action="agent-restart" data-name="${esc(name)}" ${online ? '' : 'disabled'}>Restart</button>
                <button class="danger" data-action="agent-stop" data-name="${esc(name)}">Kick</button>
            </div>
        </div>
        <div class="panel-body grid">
            <div class="grid overview-grid">
                ${metric('Position', state?.gameplay?.position ? `${state.gameplay.position.x}, ${state.gameplay.position.y}, ${state.gameplay.position.z}` : '-', state?.gameplay?.dimension ?? '-')}
                ${metric('Health / hunger', `${state?.gameplay?.health ?? '-'} / ${state?.gameplay?.hunger ?? '-'}`, state?.gameplay?.biome ?? '-')}
                ${metric('Action', state?.action?.current ?? '-', state?.action?.kind ?? '-')}
            </div>
            ${promptPanel('agent', name)}
            <section>
                <h3>Inventory</h3>
                ${keyValueTable(inv)}
            </section>
        </div>
    `;
}

function renderRpNpcDetails(npc) {
    const cfg = npc.config ?? {};
    const state = npc.state ?? {};
    const name = cfg.osebnost?.ime ?? npc.id;
    return `
        <div class="panel-head">
            <div>
                <h2>${esc(name)}</h2>
                <div class="subtle small">${esc(cfg.osebnost?.vloga ?? cfg.job ?? npc.id)}</div>
            </div>
            <div class="toolbar">
                <button class="primary" data-action="rp-npc-runtime" data-id="${esc(npc.id)}" data-runtime-action="start">Start</button>
                <button class="danger" data-action="rp-npc-runtime" data-id="${esc(npc.id)}" data-runtime-action="kick">Kick</button>
                <button class="amber" data-action="rp-npc-runtime" data-id="${esc(npc.id)}" data-runtime-action="restart">Restart</button>
            </div>
        </div>
        <div class="panel-body grid">
            <div class="toolbar">
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="come">Pridi</button>
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="follow">Sledi</button>
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="stay">Ostani</button>
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="work">Delaj</button>
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="sleep">Spat</button>
                <button data-action="rp-control" data-id="${esc(npc.id)}" data-control="free">Prosto</button>
            </div>
            ${promptPanel('rp', npc.id)}
            <div class="split">
                <section>
                    <div class="panel-head" style="padding-left:0;padding-right:0;border-bottom:0;"><h3>Potrebe</h3><button class="primary" data-action="save-rp-state" data-id="${esc(npc.id)}">Save State</button></div>
                    <div class="form-grid">${rangeInputs('state', npc.id, 'potrebe', state.potrebe)}</div>
                </section>
                <section>
                    <h3>Lastnosti</h3>
                    <div class="form-grid" style="margin-top:10px;">${rangeInputs('state', npc.id, 'lastnosti', state.lastnosti)}</div>
                </section>
            </div>
            <section>
                <div class="panel-head" style="padding-left:0;padding-right:0;border-bottom:0;">
                    <h3>Job & Schedule</h3>
                    <button class="primary" data-action="save-rp-config" data-id="${esc(npc.id)}">Save Config</button>
                </div>
                <div class="form-grid">
                    ${textInput('config', npc.id, 'job', cfg.job)}
                    ${textInput('config', npc.id, 'job_region', cfg.job_region)}
                    ${textInput('config', npc.id, 'home_region', cfg.home_region)}
                    ${checkInput('config', npc.id, 'vendor', cfg.vendor)}
                    ${numberInput('config', npc.id, 'schedule.work_start', cfg.schedule?.work_start)}
                    ${numberInput('config', npc.id, 'schedule.work_end', cfg.schedule?.work_end)}
                    ${numberInput('config', npc.id, 'schedule.sleep_start', cfg.schedule?.sleep_start)}
                    ${numberInput('config', npc.id, 'schedule.sleep_end', cfg.schedule?.sleep_end)}
                </div>
            </section>
            <section>
                <h3>Social</h3>
                ${renderRelations(state)}
            </section>
            <div class="split">
                ${jsonEditor('Config JSON', 'config-json', npc.id, cfg, 'save-rp-config-json')}
                ${jsonEditor('State JSON', 'state-json', npc.id, state, 'save-rp-state-json')}
            </div>
        </div>
    `;
}

function promptPanel(kind, id) {
    const placeholder = kind === 'rp'
        ? 'Npr: Preglej svoje spomine o Jaki in popravi napačen povzetek v svojem memoryju.'
        : 'Npr: Ustavi trenutno nalogo in preveri inventory.';
    return `
        <section class="prompt-box">
            <h3>Direct AI Prompt</h3>
            <textarea id="prompt-${kind}-${esc(id)}" style="min-height:86px;" placeholder="${esc(placeholder)}"></textarea>
            <div class="toolbar">
                <button class="blue" data-action="send-prompt" data-kind="${esc(kind)}" data-id="${esc(id)}">Send Prompt</button>
                ${kind === 'rp' ? `<button data-action="save-memory" data-id="${esc(id)}">Save As Memory</button>` : ''}
            </div>
        </section>
    `;
}

function rangeInputs(scope, id, group, values = {}) {
    return Object.entries(values).map(([key, value]) => `
        <label>
            <span><b>${esc(key)}</b><output id="out-${scope}-${esc(id)}-${esc(group)}-${esc(key)}">${esc(value)}</output></span>
            <input type="range" min="0" max="100" step="1" value="${esc(value)}"
                data-action="range-edit" data-scope="${esc(scope)}" data-id="${esc(id)}" data-path="${esc(group)}.${esc(key)}">
        </label>
    `).join('');
}

function textInput(scope, id, path, value) {
    return `
        <label>
            <span><b>${esc(path)}</b></span>
            <input data-action="field-edit" data-scope="${esc(scope)}" data-id="${esc(id)}" data-path="${esc(path)}" value="${esc(value ?? '')}">
        </label>
    `;
}

function numberInput(scope, id, path, value) {
    return `
        <label>
            <span><b>${esc(path)}</b></span>
            <input type="number" data-action="field-edit" data-scope="${esc(scope)}" data-id="${esc(id)}" data-path="${esc(path)}" value="${esc(value ?? 0)}">
        </label>
    `;
}

function checkInput(scope, id, path, checked) {
    return `
        <label>
            <span><b>${esc(path)}</b></span>
            <input type="checkbox" data-action="field-edit" data-scope="${esc(scope)}" data-id="${esc(id)}" data-path="${esc(path)}" ${checked ? 'checked' : ''}>
        </label>
    `;
}

function jsonEditor(title, elementPrefix, id, data, action) {
    return `
        <section>
            <div class="panel-head" style="padding-left:0;padding-right:0;border-bottom:0;">
                <h3>${esc(title)}</h3>
                <button class="primary" data-action="${esc(action)}" data-id="${esc(id)}">Save JSON</button>
            </div>
            <textarea id="${esc(elementPrefix)}-${esc(id)}">${esc(JSON.stringify(data, null, 2))}</textarea>
        </section>
    `;
}

function renderRelations(state) {
    const bonds = state.social?.bonds ?? {};
    const npcRows = Object.entries(bonds).map(([id, bond]) => `
        <tr><td>${esc(id)}</td><td>${esc(bond.status ?? '-')}</td><td>${esc(Math.round(bond.trust ?? 0))}</td><td>${esc(Math.round(bond.affinity ?? 0))}</td><td>${esc(Math.round(bond.tension ?? 0))}</td></tr>
    `).join('');
    const playerRows = Object.entries(state.odnosi_igralci ?? {}).map(([id, rel]) => `
        <tr><td>${esc(id)}</td><td>${esc(rel.mnenje ?? '-')}</td><td>${esc(rel.zaupanje ?? '-')}</td><td></td><td></td></tr>
    `).join('');
    return `
        <table class="table">
            <thead><tr><th>Who</th><th>Status / mnenje</th><th>Trust</th><th>Affinity</th><th>Tension</th></tr></thead>
            <tbody>${npcRows || playerRows ? npcRows + playerRows : '<tr><td colspan="5" class="subtle">Odnosi se se oblikujejo.</td></tr>'}</tbody>
        </table>
    `;
}

function renderSocial() {
    const civic = dashboard?.rp?.civic ?? {};
    const leaders = civic.social_structure?.leaders ?? [];
    const circles = civic.social_structure?.circles ?? [];
    const members = kingdomMembers();
    content.innerHTML = `
        <div class="grid three-col">
            <section class="panel">
                <div class="panel-head"><h2>RP Leaders</h2></div>
                <div class="panel-body">${leaders.map(l => `
                    <div class="row"><span><b>${esc(l.name ?? l.id)}</b><div class="subtle small">${esc(l.id)}</div></span><span class="pill blue">${esc(l.score)}</span></div>
                `).join('') || empty('Vodje se se oblikujejo.')}</div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>RP Circles</h2></div>
                <div class="panel-body">${circles.map(c => `
                    <div class="row"><span><b>${esc(c.name ?? c.key)}</b><div class="subtle small">${esc((c.members ?? []).join(', '))}</div></span><span class="pill amber">${esc(c.anchor ?? '-')}</span></div>
                `).join('') || empty('Ni krogov.')}</div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>Kingdom Roles</h2></div>
                <div class="panel-body">${members.map(m => `
                    <div class="row"><span><b>${esc(m.name)}</b><div class="subtle small">${esc(m.action ?? '-')}</div></span><span class="pill ${m.online ? 'green' : 'red'}">${esc(m.role ?? '-')}</span></div>
                `).join('') || empty('Ni kingdom state-a.')}</div>
            </section>
        </div>
        <section class="panel" style="margin-top:14px;">
            <div class="panel-head"><h2>Bond Matrix</h2></div>
            <div class="panel-body">${renderBondMatrix()}</div>
        </section>
    `;
}

function renderBondMatrix() {
    const npcs = rpNpcs();
    if (!npcs.length) return empty('Ni RP NPC-jev.');
    const rows = npcs.map(a => `
        <tr>
            <th>${esc(a.config?.osebnost?.ime ?? a.id)}</th>
            ${npcs.map(b => {
                if (a.id === b.id) return '<td class="subtle">self</td>';
                const bond = a.state?.social?.bonds?.[b.id] ?? a.state?.odnosi_npcji?.[b.id];
                return `<td>${esc(bond?.status ?? bond?.mnenje ?? '-')}${bond?.trust || bond?.zaupanje ? `<div class="subtle small">trust ${esc(Math.round(bond.trust ?? bond.zaupanje))}</div>` : ''}</td>`;
            }).join('')}
        </tr>
    `).join('');
    return `
        <table class="table">
            <thead><tr><th>NPC</th>${npcs.map(n => `<th>${esc(n.config?.osebnost?.ime ?? n.id)}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function renderStorage() {
    const rp = rpNpcs();
    const publicStorage = dashboard?.kingdom?.publicStorage;
    const kingdomTotals = {};
    for (const member of kingdomMembers()) {
        for (const [key, count] of Object.entries(member.inventory ?? {})) {
            kingdomTotals[key] = (kingdomTotals[key] ?? 0) + Number(count || 0);
        }
    }
    content.innerHTML = `
        <div class="grid two-col">
            <section class="panel">
                <div class="panel-head"><h2>RP Storage</h2></div>
                <div class="panel-body">
                    <div class="list">
                    ${rp.map(npc => `
                        <div class="row" style="align-items:start;">
                            <span class="row-main">
                                <span class="row-title">${esc(npc.config?.osebnost?.ime ?? npc.id)}</span>
                                <span class="subtle small">${esc(npc.storageSummary?.chestCount ?? 0)} chestov</span>
                                ${keyValueTable(npc.storageSummary?.totals ?? {})}
                            </span>
                        </div>
                    `).join('') || empty('Ni storage indexov.')}
                    </div>
                </div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>Kingdom Storage</h2></div>
                <div class="panel-body">
                    ${publicStorage ? `
                        <div class="grid overview-grid">
                            ${metric('Public storage', `${publicStorage.x}, ${publicStorage.y}, ${publicStorage.z}`, publicStorage.dimension ?? '-')}
                            ${metric('Containers', publicStorage.containers?.length ?? 0, `radius ${publicStorage.radius ?? '-'}`)}
                        </div>
                    ` : empty('Public storage ni nastavljen.')}
                    <h3 style="margin-top:14px;">Member Inventory Totals</h3>
                    ${keyValueTable(kingdomTotals)}
                </div>
            </section>
        </div>
    `;
}

function renderAccess() {
    const settings = dashboard?.rp?.settings ?? {};
    content.innerHTML = `
        <div class="grid two-col">
            <section class="panel">
                <div class="panel-head"><h2>Whitelist / Blacklist</h2><button class="primary" data-action="save-access">Save</button></div>
                <div class="panel-body grid">
                    <label><span><b>admin_players</b></span><textarea id="adminPlayers" style="min-height:110px;">${esc((settings.admin_players ?? []).join('\n'))}</textarea></label>
                    <label><span><b>blacklisted_players</b></span><textarea id="blacklistedPlayers" style="min-height:110px;">${esc((settings.blacklisted_players ?? []).join('\n'))}</textarea></label>
                </div>
            </section>
            <section class="panel">
                <div class="panel-head"><h2>RP Settings JSON</h2><button class="primary" data-action="save-settings-json">Save JSON</button></div>
                <div class="panel-body">
                    <textarea id="settingsJson" style="min-height:420px;">${esc(JSON.stringify(settings, null, 2))}</textarea>
                </div>
            </section>
        </div>
    `;
}

function renderLogs() {
    const rpEvents = rpNpcs().flatMap(npc => (npc.eventLog ?? []).map(event => ({
        ...event,
        agentName: npc.config?.osebnost?.ime ?? npc.id,
    })));
    content.innerHTML = `
        <div class="grid three-col">
            ${recentPanel('RP event logs', rpEvents, 'podrobnost', 'ts')}
            ${recentPanel('Town public events', dashboard?.rp?.civic?.public_events ?? [], 'text', 'ts')}
            ${recentPanel('Bot output', botOutputs, 'message', 'at')}
        </div>
    `;
}

function keyValueTable(obj) {
    const entries = Object.entries(obj ?? {}).sort((a, b) => String(a[0]).localeCompare(String(b[0])));
    if (!entries.length) return '<div class="subtle small">-</div>';
    return `
        <table class="table">
            <tbody>${entries.map(([key, value]) => `<tr><th>${esc(key)}</th><td>${esc(pretty(value))}</td></tr>`).join('')}</tbody>
        </table>
    `;
}

function empty(text) {
    return `<div class="empty">${esc(text)}</div>`;
}

function getRpNpc(id) {
    return rpNpcs().find(n => n.id === id);
}

function setPath(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (const part of parts.slice(0, -1)) {
        cur[part] ??= {};
        cur = cur[part];
    }
    cur[parts.at(-1)] = value;
}

async function saveRpState(id) {
    const npc = getRpNpc(id);
    await api(`/api/rp/npcs/${encodeURIComponent(id)}/state`, {
        method: 'PUT',
        body: JSON.stringify(npc.state),
    });
    await refreshDashboard(true);
    showToast('State shranjen.');
}

async function saveRpConfig(id) {
    const npc = getRpNpc(id);
    await api(`/api/rp/npcs/${encodeURIComponent(id)}/config`, {
        method: 'PUT',
        body: JSON.stringify(npc.config),
    });
    await refreshDashboard(true);
    showToast('Config shranjen.');
}

document.addEventListener('click', async (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    try {
        if (action === 'tab') {
            activeTab = target.dataset.tab;
            render();
        } else if (action === 'refresh') {
            await refreshDashboard();
        } else if (action === 'select-npc') {
            selectedKey = target.dataset.key;
            activeTab = 'npcs';
            render();
        } else if (action === 'rp-runtime') {
            await api(`/api/rp/runtime/${target.dataset.runtimeAction}`, { method: 'POST', body: '{}' });
            await refreshDashboard(true);
        } else if (action === 'rp-npc-runtime') {
            await api(`/api/rp/npcs/${target.dataset.id}/runtime/${target.dataset.runtimeAction}`, { method: 'POST', body: '{}' });
            await refreshDashboard(true);
        } else if (action === 'rp-control') {
            await api(`/api/rp/npcs/${target.dataset.id}/control`, {
                method: 'POST',
                body: JSON.stringify({ type: target.dataset.control }),
            });
            showToast('Ukaz poslan.');
        } else if (action === 'agent-start') {
            socket.emit('start-agent', target.dataset.name);
        } else if (action === 'agent-restart') {
            socket.emit('restart-agent', target.dataset.name);
        } else if (action === 'agent-stop') {
            socket.emit('stop-agent', target.dataset.name);
        } else if (action === 'stop-all') {
            socket.emit('stop-all-agents');
            showToast('Kingdom stop poslan.');
        } else if (action === 'send-prompt') {
            await sendPrompt(target.dataset.kind, target.dataset.id);
        } else if (action === 'save-memory') {
            await saveMemory(target.dataset.id);
        } else if (action === 'save-rp-state') {
            await saveRpState(target.dataset.id);
        } else if (action === 'save-rp-config') {
            await saveRpConfig(target.dataset.id);
        } else if (action === 'save-rp-config-json') {
            const id = target.dataset.id;
            getRpNpc(id).config = JSON.parse(document.getElementById(`config-json-${id}`).value);
            await saveRpConfig(id);
        } else if (action === 'save-rp-state-json') {
            const id = target.dataset.id;
            getRpNpc(id).state = JSON.parse(document.getElementById(`state-json-${id}`).value);
            await saveRpState(id);
        } else if (action === 'save-access') {
            await saveAccess();
        } else if (action === 'save-settings-json') {
            await api('/api/rp/settings', {
                method: 'PUT',
                body: document.getElementById('settingsJson').value,
            });
            await refreshDashboard(true);
            showToast('Settings shranjen.');
        }
    } catch (error) {
        showToast(error.message, true);
    }
});

document.addEventListener('input', (event) => {
    const target = event.target;
    if (!target.matches('[data-action="range-edit"], [data-action="field-edit"]')) return;
    const npc = getRpNpc(target.dataset.id);
    if (!npc) return;
    const root = target.dataset.scope === 'config' ? npc.config : npc.state;
    let value;
    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'number' || target.type === 'range') value = Number(target.value);
    else value = target.value;
    setPath(root, target.dataset.path, value);
    if (target.type === 'range') {
        const [group, key] = target.dataset.path.split('.');
        const out = document.getElementById(`out-state-${target.dataset.id}-${group}-${key}`);
        if (out) out.value = value;
    }
});

async function sendPrompt(kind, id) {
    const textarea = document.getElementById(`prompt-${kind}-${id}`);
    const message = textarea?.value?.trim();
    if (!message) return;
    if (kind === 'agent') {
        socket.emit('send-message', id, { from: 'ADMIN', message });
        textarea.value = '';
        showToast('Prompt poslan agentu.');
        return;
    }
    const result = await api(`/api/rp/npcs/${encodeURIComponent(id)}/prompt`, {
        method: 'POST',
        body: JSON.stringify({ from: 'Dashboard', message }),
    });
    textarea.value = '';
    showToast(result.result?.reply ? `Reply: ${result.result.reply.slice(0, 120)}` : 'Prompt poslan RP NPC-ju.');
}

async function saveMemory(id) {
    const textarea = document.getElementById(`prompt-rp-${id}`);
    const text = textarea?.value?.trim();
    if (!text) return;
    await api(`/api/rp/npcs/${encodeURIComponent(id)}/memory`, {
        method: 'POST',
        body: JSON.stringify({ who: 'Dashboard', text }),
    });
    textarea.value = '';
    await refreshDashboard(true);
    showToast('Memory dodan.');
}

async function saveAccess() {
    const adminPlayers = document.getElementById('adminPlayers').value.split('\n').map(s => s.trim()).filter(Boolean);
    const blacklistedPlayers = document.getElementById('blacklistedPlayers').value.split('\n').map(s => s.trim()).filter(Boolean);
    await api('/api/rp/access', {
        method: 'POST',
        body: JSON.stringify({ admin_players: adminPlayers, blacklisted_players: blacklistedPlayers }),
    });
    await refreshDashboard(true);
    showToast('Access shranjen.');
}

socket.on('connect', () => {
    setSocketStatus(true);
    socket.emit('listen-to-agents');
});

socket.on('disconnect', () => setSocketStatus(false));
socket.on('connect_error', () => setSocketStatus(false));

socket.on('agents-status', list => {
    agents = list ?? [];
    if (!selectedKey && agents[0]) selectedKey = `agent:${agents[0].name}`;
    updateHeader();
    if (activeTab === 'overview' || activeTab === 'npcs' || activeTab === 'social') render();
});

socket.on('state-update', states => {
    agentStates = states ?? {};
    if (activeTab === 'npcs' || activeTab === 'overview') render();
});

socket.on('bot-output', (agentName, message) => {
    botOutputs.push({ agentName, message, at: new Date().toLocaleTimeString() });
    botOutputs = botOutputs.slice(-80);
    if (activeTab === 'logs' || activeTab === 'overview') render();
});

setSocketStatus(false);
refreshDashboard(true);
refreshTimer = setInterval(() => refreshDashboard(true), 5000);
</script>
</body>
</html>
